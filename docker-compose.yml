version: '3.8'
services:
  web:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - CALLAS_HOME=/opt/callas
      - CALLAS_LANGUAGE=en
      - VIZITKA_SESSION_DIR=/tmp/vizitka-sessions
    volumes:
      - ./logs:/app/logs
      - /opt/pdftoolbox/callas_pdfToolboxCLI_x64_Linux_17-0-682:/opt/callas:ro
      - vizitka-sessions:/tmp/vizitka-sessions

volumes:
  vizitka-sessions:
