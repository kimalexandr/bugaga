services:
  web:
    build: .
    # Лицензия Callas привязана к MAC хоста — bridge-сеть контейнера даёт другие UUID.
    network_mode: host
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - CALLAS_HOME=/opt/callas
      - CALLAS_LANGUAGE=en
      - CALLAS_CACHE_FOLDER=/var/callas-license
      - TRIM_PREVIEW_OFFSET_MM=1.0
      - VIZITKA_SESSION_DIR=/tmp/vizitka-sessions
      - LOG_DIR=/app/logs
    volumes:
      - ./logs:/app/logs
      - /opt/pdftoolbox/callas_pdfToolboxCLI_x64_Linux_17-0-682:/opt/callas:ro
      - ./callas-license:/var/callas-license
      - /root/.callas software:/root/.callas software:ro
      - vizitka-sessions:/tmp/vizitka-sessions

volumes:
  vizitka-sessions:
